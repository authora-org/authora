[versions]
kotlin = "2.0.21"
agp = "8.7.2"
composeBom = "2024.10.00"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
coreKtx = "1.15.0"
securityCrypto = "1.1.0-alpha06"
serializationJson = "1.7.3"
